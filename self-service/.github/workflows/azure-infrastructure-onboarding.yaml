name: Provision AKS (Terraform)

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project name (property)'
        required: true
        default: 'myproject'
      service_name:
        description: 'Service name (property)'
        required: true
        default: 'myservice'
      tech_stack:
        description: 'Tech stack (e.g. python)'
        required: true
        default: 'python'
      python_version:
        description: 'Python version (e.g. 3.11)'
        required: true
        default: '3.11'
      deploy_to:
        description: 'Deployment target (e.g. AKS)'
        required: true
        default: 'AKS'
      location:
        description: 'Azure region (e.g. eastus)'
        required: true
        default: 'eastus'
      environment:
        description: 'Deployment environment (e.g. dev/staging/prod)'
        required: true
        default: 'dev'
      resource_group:
        description: 'Optional explicit resource group name (if not set, workflow will derive one)'
        required: false
        default: 'demo1-rg-selfservice'
      tf_path:
        description: 'Path to Terraform templates (working directory)'
        required: false
        default: 'templates/templates/service-composer/skeleton'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
     FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create resource group folder with resources terraform files(if resource_group input provided)
        id: create
        run: |
          set -euo pipefail
          RG="${{ github.event.inputs.resource_group }}"
          PROJECT="${{ github.event.inputs.project_name }}"
          SERVICE="${{ github.event.inputs.service_name }}"
          TECH="${{ github.event.inputs.tech_stack }}"
          PYVER="${{ github.event.inputs.python_version }}"
          DEPLOY_TO="${{ github.event.inputs.deploy_to }}"
          TARGET_DIR="${{ github.event.inputs.resource_group }}"
          if [ -z "$TARGET_DIR" ]; then
            echo "No resource_group input provided; skipping creation"
            exit 0
          fi

          if [ -d "$TARGET_DIR" ]; then
            echo "Resource group folder already exists: $TARGET_DIR"
            exit 1
          fi

          mkdir -p "$TARGET_DIR"

          cat > "$TARGET_DIR/main.tf" <<EOF 
          //Terraform resources for ${RG}
          //Replace variables as needed.    
          resource "azurerm_resource_group" "main" {
            name     = var.resource_group_name
            location = var.location
          } 
            EOF
          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "resource_group_name" {
            description = "Name of the Azure resource group"
            type        = string
          }

          variable "location" {
            description = "Azure region for resources"
            type        = string
          } 
          variable "project_name" {
            description = "Project identifier"
            type        = string
            default     = ""
          }
          variable "service_name" {
            description = "Service identifier"
            type        = string
            default     = ""
          }
          variable "tech_stack" {
            description = "Technology stack (e.g. python)"
            type        = string
            default     = ""
          }
          variable "python_version" {
            description = "Python runtime version"
            type        = string
            default     = ""
          }
          variable "deploy_to" {
            description = "Deployment target (e.g. AKS)"
            type        = string
            default     = ""
          }
          EOF
          Resource group: ${RG} 

          cat > $TARGET_DIR/outputs.tf <<'EOF'
          output "resource_group_name" {
            description = "The resource group name"
            value       = var.resource_group_name
          }
            EOF
          if [ "${DEPLOY_TO}" = "AKS" ] || [ "${DEPLOY_TO}" = "aks" ]; then
            cat > "$TARGET_DIR/aks.tf" <<EOF
          provider "azurerm" {
            features = {}
          }
          resource "azurerm_kubernetes_cluster" "aks" {
            name                = "${PROJECT}-${SERVICE}-aks"
            location            = var.location
            resource_group_name = var.resource_group_name

            default_node_pool {
              name       = "default"
              node_count = 1
              vm_size    = "Standard_DS2_v2"
            }

            identity {
              type = "SystemAssigned"
            }

            tags = {
              project = var.project_name
              service = var.service_name
              tech    = var.tech_stack
            }
          }
            EOF

            cat >> "$TARGET_DIR/outputs.tf" <<'EOF'
            output "aks_cluster_name" {
            description = "AKS cluster name (if created)"
            value       = azurerm_kubernetes_cluster.aks.name
            }
            EOF

          cat > "$TARGET_DIR/outputs.tf" <<'EOF'
          output "resource_group_name" {
          description = "The resource group name"
          value       = var.resource_group_name}
          EOF

          if [ "${DEPLOY_TO}" = "AKS" ] || [ "${DEPLOY_TO}" = "aks" ]; then
            cat > "$TARGET_DIR/aks.tf" <<EOF
            provider "azurerm" {
            features = {}
            }
            
            resource "azurerm_kubernetes_cluster" "aks" {
            name                = "${PROJECT}-${SERVICE}-aks"
            location            = var.location
            resource_group_name = var.resource_group_name
            
            default_node_pool {
            name       = "default"
            node_count = 1
            vm_size    = "Standard_DS2_v2"
            }
            
            identity {
            type = "SystemAssigned"
            
            }

            tags = {
            project = var.project_name
            service = var.service_name
            tech    = var.tech_stack
            }
            }
            EOF

            cat >> "$TARGET_DIR/outputs.tf" <<'EOF'
            output "aks_cluster_name" {
            description = "AKS cluster name (if created)" 
            value       = azurerm_kubernetes_cluster.aks.name
            }
            EOF
          fi

          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "resource_group_name" {
          description = "Name of the Azure resource group"
          type        = string
          default     = ""
          }
          EOF

          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "location" { 
          description = "Azure region for resources"
          type        = string
          default     = ""
          }
          EOF

          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "project_name" {  
          description = "Project identifier"
          type        = string
          default     = ""
          }
          EOF

          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "service_name" {
          description = "Service identifier"
          type        = string
          default     = ""
          }
          EOF

          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "tech_stack" {
          description = "Technology stack (e.g. python)"
          type        = string
          default     = ""
          }
          EOF

          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "python_version" {
          description = "Python runtime version"
          type        = string
          default     = ""
          }
          EOF

          cat > "$TARGET_DIR/variables.tf" <<'EOF'
          variable "deploy_to" {
          description = "Deployment target (e.g. AKS)"
          type        = string
          default     = ""
          }
          EOF

          cat >> "$TARGET_DIR/variables.tf" <<'EOF'
          variable "location" {
          description = "Location of the Azure resource group"
          type        = string
          default     = "East US"
          }
          EOF

          cat >> "$TARGET_DIR/variables.tf" <<'EOF'
          variable "project_name" {
          description = "Name of the project"
          type        = string
          default     = ""
          }
          EOF

          cat >> "$TARGET_DIR/variables.tf" <<'EOF'
          variable "service_name" {
          description = "Name of the service"
          type        = string
          default     = ""
          }
          EOF

          cat >> "$TARGET_DIR/variables.tf" <<'EOF'
          variable "tech_stack" {
          description = "Technology stack used"
          type        = string
          default     = ""
          }
          EOF
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="add-rg-${RG}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add "$TARGET_DIR"
          git commit -m "Add resource group folder: ${RG} (generated by workflow)"
          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request for new resource group folder
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add resource group ${{ github.event.inputs.resource_group }}"
          title: "Add resource group ${{ github.event.inputs.resource_group }}"
          body: "Automated PR to add resource group folder `${{ github.event.inputs.resource_group }}`."
          base: main
          #head: ${{ steps.create.outputs.branch }}


      - name: Check Terraform variable files
        working-directory: ${{ github.event.inputs.tf_path }}
        run: |
          set -e
          echo "Checking for *.tfvars files in $(pwd)..."
          shopt -s nullglob || true
          files=( *.tfvars *.tfvars.json )
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No .tfvars files found in the Terraform working directory. Add a terraform.tfvars (or *.tfvars) file or change tf_path to a folder that contains one."
            exit 1
          fi

      - name: Azure Login (service principal creds)
        uses: azure/login@v3
        with:
          secrets ${{ secrets.AZURE_CREDENTIALS }}


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init
        working-directory: ${{ github.event.inputs.tf_path }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ github.event.inputs.tf_path }}
        run: |
          set -e
          # derive resource group if not provided
          RG="${{ github.event.inputs.resource_group }}"
          if [ -z "$RG" ]; then
            RG="${{ github.event.inputs.project_name }}-${{ github.event.inputs.environment }}-rg"
          fi
          ENABLE_AKS="false"
          if [ "${{ github.event.inputs.deploy_to }}" = "AKS" ]; then
            ENABLE_AKS="true"
          fi
          VARS="-var project_name='${{ github.event.inputs.project_name }}' -var resource_group='${RG}' -var location='${{ github.event.inputs.location }}' -var environment='${{ github.event.inputs.environment }}' -var enable_aks=${ENABLE_AKS}"
          VARS="$VARS -var service_name='${{ github.event.inputs.service_name }}' -var tech_stack='${{ github.event.inputs.tech_stack }}' -var python_version='${{ github.event.inputs.python_version }}'"
          echo "Running terraform validate with: $VARS"
          terraform validate $VARS

      - name: Terraform Plan
        working-directory: ${{ github.event.inputs.tf_path }}
        run: |
          set -e
          # derive resource group if not provided
          RG="${{ github.event.inputs.resource_group }}"
          if [ -z "$RG" ]; then
            RG="${{ github.event.inputs.project_name }}-${{ github.event.inputs.environment }}-rg"
          fi
          # enable aks if deploy_to == AKS
          ENABLE_AKS="false"
          if [ "${{ github.event.inputs.deploy_to }}" = "AKS" ]; then
            ENABLE_AKS="true"
          fi
          VARS="-var project_name='${{ github.event.inputs.project_name }}' -var resource_group='${RG}' -var location='${{ github.event.inputs.location }}' -var environment='${{ github.event.inputs.environment }}' -var enable_aks=${ENABLE_AKS}"
          # pass through optional service/tech details
          VARS="$VARS -var service_name='${{ github.event.inputs.service_name }}' -var tech_stack='${{ github.event.inputs.tech_stack }}' -var python_version='${{ github.event.inputs.python_version }}'"
          echo "Running terraform plan with: $VARS"
          terraform plan -input=false $VARS -out=plan.tfplan

      - name: Terraform Apply
        working-directory: ${{ github.event.inputs.tf_path }}
        run: terraform apply -input=false -auto-approve plan.tfplan

      - name: Retrieve kubeconfig (if AKS)
        if: ${{ github.event.inputs.deploy_to == 'AKS' }}
        uses: azure/CLI@v1
        with:
          azcliversion: '2.55.0'
          inlineScript: |
            set -e
            cd "${{ github.event.inputs.tf_path }}" || true
            AKS_NAME=$(terraform output -raw aks_name 2>/dev/null || echo "${{ github.event.inputs.service_name }}")
            RG=$(terraform output -raw resource_group 2>/dev/null || echo "${{ github.event.inputs.project_name }}-rg")
            echo "Using resource group: $RG and cluster name: $AKS_NAME"
            az aks get-credentials --resource-group "$RG" --name "$AKS_NAME" --admin || echo "az aks get-credentials failed; verify names or Terraform outputs"
            kubectl version --short || true
            echo "Kubeconfig retrieved for AKS cluster: $AKS_NAME"
            