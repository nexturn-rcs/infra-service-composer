name: Provision AKS (Terraform)

name: Add resource group and open PR

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Resource group directory name to create under self-service/azure-infrastructure/resource_groups'
        required: true
      base_branch:
        description: 'Target branch for the PR'
        required: false
        default: 'main'

jobs:
  create-resource-group:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create resource group folder and push branch
        id: create
        run: |
          set -euo pipefail
          RG="${{ github.event.inputs.resource_group }}"
          BASE_BRANCH="${{ github.event.inputs.base_branch }}"
          TARGET_DIR="self-service/azure-infrastructure/resource_groups/${RG}"

          if [ -d "$TARGET_DIR" ]; then
            echo "Resource group folder already exists: $TARGET_DIR"
            exit 1
          fi

          mkdir -p "$TARGET_DIR"

          cat > "$TARGET_DIR/README.md" <<'EOF'
          # Resource group: ${RG}

          Add Terraform files for this resource group under this directory.
          EOF

          cat > "$TARGET_DIR/terraform.tfvars.example" <<'EOF'
          # example variables for ${RG}
          resource_group_name = "${RG}"
          location = "<region>"
          EOF

          cat > "$TARGET_DIR/main.tf" <<'EOF'
          // Terraform resources for ${RG}
          // Replace variables as needed.
          resource "azurerm_resource_group" "main" {
            name     = var.resource_group_name
            location = var.location
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="add-rg-${RG}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add "$TARGET_DIR"
          git commit -m "Add resource group folder: ${RG}"
          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add resource group ${{ github.event.inputs.resource_group }}"
          title: "Add resource group ${{ github.event.inputs.resource_group }}"
          body: "Automated PR to add resource group folder `${{ github.event.inputs.resource_group }}`."
          base: ${{ github.event.inputs.base_branch }}
          head: ${{ steps.create.outputs.branch }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve plan.tfplan

      - name: Retrieve kubeconfig (if AKS)
        if: ${{ github.event.inputs.deploy_to == 'AKS' }}
        uses: azure/CLI@v1
        with:
          azcliversion: '2.55.0'
          inlineScript: |
            set -e
            cd "${TF_WORKDIR:-${{ github.event.inputs.tf_path }}}" || true
            AKS_NAME=$(terraform output -raw aks_name 2>/dev/null || echo "${{ github.event.inputs.service_name }}")
            RG=$(terraform output -raw resource_group 2>/dev/null || echo "${{ github.event.inputs.project_name }}-rg")
            echo "Using resource group: $RG and cluster name: $AKS_NAME"
            az aks get-credentials --resource-group "$RG" --name "$AKS_NAME" --admin || echo "az aks get-credentials failed; verify names or Terraform outputs"
            kubectl version --short || true
