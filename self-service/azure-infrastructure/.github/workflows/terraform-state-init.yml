name: Terraform State Init

on:
  workflow_dispatch:
    inputs:
      confirm_init:
        description: 'Type "initialize" to confirm state initialization'
        required: true
        type: string

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  RESOURCE_GROUP_NAME: rg-nextops-otis-tfstate
  STORAGE_ACCOUNT_NAME: nextopsotistfstate
  CONTAINER_NAME: tfstate
  LOCATION: eastus

jobs:
  initialize-state-backend:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_init == 'initialize' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }
      
      - name: Create Resource Group
        run: |
          echo "Creating resource group: $RESOURCE_GROUP_NAME"
          az group create \
            --name $RESOURCE_GROUP_NAME \
            --location $LOCATION \
            --tags "Purpose=TerraformState" "ManagedBy=Terraform" "Environment=Shared"
          
          echo "✅ Resource group created successfully"
      
      - name: Create Storage Account
        run: |
          echo "Creating storage account: $STORAGE_ACCOUNT_NAME"
          az storage account create \
            --name $STORAGE_ACCOUNT_NAME \
            --resource-group $RESOURCE_GROUP_NAME \
            --location $LOCATION \
            --sku Standard_LRS \
            --kind StorageV2 \
            --https-only true \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --tags "Purpose=TerraformState" "ManagedBy=Terraform" "Environment=Shared"
          
          echo "✅ Storage account created successfully"
      
      - name: Create Blob Container
        run: |
          echo "Creating blob container: $CONTAINER_NAME"
          az storage container create \
            --name $CONTAINER_NAME \
            --account-name $STORAGE_ACCOUNT_NAME \
            --auth-mode login
          
          echo "✅ Blob container created successfully"
      
      - name: Enable Versioning
        run: |
          echo "Enabling blob versioning for state file protection"
          az storage account blob-service-properties update \
            --resource-group $RESOURCE_GROUP_NAME \
            --account-name $STORAGE_ACCOUNT_NAME \
            --enable-versioning true
          
          echo "✅ Blob versioning enabled"
      
      - name: Display Backend Configuration
        run: |
          echo "=========================================="
          echo "Terraform Backend Configuration"
          echo "=========================================="
          echo ""
          echo "Add this to your Terraform configuration:"
          echo ""
          echo "terraform {"
          echo "  backend \"azurerm\" {"
          echo "    resource_group_name  = \"$RESOURCE_GROUP_NAME\""
          echo "    storage_account_name = \"$STORAGE_ACCOUNT_NAME\""
          echo "    container_name       = \"$CONTAINER_NAME\""
          echo "    key                  = \"<resource-group-name>.tfstate\""
          echo "  }"
          echo "}"
          echo ""
          echo "Directory structure: resource_groups/<resource-group-name>/*.tf"
          echo "=========================================="
      
      - name: Azure Logout
        if: always()
        run: |
          az logout
