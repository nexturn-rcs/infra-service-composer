name: Add resource group and open PR (self-service)

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Resource group directory name to create under self-service/azure-infrastructure/resource_groups'
        required: true
      project_name:
        description: 'Project name'
        required: false
      service_name:
        description: 'Service name'
        required: false
      tech_stack:
        description: 'Tech stack (e.g. python)'
        required: false
      python_version:
        description: 'Python version (e.g. 3.11)'
        required: false
      deploy_to:
        description: 'Deployment target (e.g. AKS)'
        required: false
      base_branch:
        description: 'Target branch for the PR'
        required: false
        default: 'main'

jobs:
  create-resource-group:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create resource group folder and push branch
        id: create
        run: |
          set -euo pipefail
          RG="${{ github.event.inputs.resource_group }}"
          BASE_BRANCH="${{ github.event.inputs.base_branch }}"
          PROJECT="${{ github.event.inputs.project_name }}"
          SERVICE="${{ github.event.inputs.service_name }}"
          TECH="${{ github.event.inputs.tech_stack }}"
          PYVER="${{ github.event.inputs.python_version }}"
          DEPLOY_TO="${{ github.event.inputs.deploy_to }}"
          TARGET_DIR="self-service/azure-infrastructure/resource_groups/${RG}"

          if [ -d "$TARGET_DIR" ]; then
            echo "Resource group folder already exists: $TARGET_DIR"
            exit 1
          fi

          mkdir -p "$TARGET_DIR"

          # write a README
          cat > "$TARGET_DIR/README.md" <<EOF
# Resource group: ${RG}

Add Terraform files for this resource group under this directory.
EOF

          # variables example
          cat > "$TARGET_DIR/terraform.tfvars.example" <<EOF
# example variables for ${RG}
resource_group_name = "${RG}"
location = "<region>"
project_name = "${PROJECT}"
service_name = "${SERVICE}"
tech_stack = "${TECH}"
python_version = "${PYVER}"
deploy_to = "${DEPLOY_TO}"
EOF

          # basic main.tf with resource group
          cat > "$TARGET_DIR/main.tf" <<EOF
// Terraform resources for ${RG}
// Replace variables as needed.
resource "azurerm_resource_group" "main" {
  name     = var.resource_group_name
  location = var.location
}
EOF

          # variables.tf (with types and descriptions)
          cat > "$TARGET_DIR/variables.tf" <<'EOF'
variable "resource_group_name" {
  description = "Name of the Azure resource group"
  type        = string
}

variable "location" {
  description = "Azure region for resources"
  type        = string
}

variable "project_name" {
  description = "Project identifier"
  type        = string
  default     = ""
}

variable "service_name" {
  description = "Service identifier"
  type        = string
  default     = ""
}

variable "tech_stack" {
  description = "Technology stack (e.g. python)"
  type        = string
  default     = ""
}

variable "python_version" {
  description = "Python runtime version"
  type        = string
  default     = ""
}

variable "deploy_to" {
  description = "Deployment target (e.g. AKS)"
  type        = string
  default     = ""
}
EOF

          # basic outputs.tf (always present)
          cat > "$TARGET_DIR/outputs.tf" <<'EOF'
output "resource_group_name" {
  description = "The resource group name"
  value       = var.resource_group_name
}
EOF
          # If deploy_to == AKS, create an aks.tf resource block
          if [ "${DEPLOY_TO}" = "AKS" ] || [ "${DEPLOY_TO}" = "aks" ]; then
            cat > "$TARGET_DIR/aks.tf" <<EOF
provider "azurerm" {
  features = {}
}

resource "azurerm_kubernetes_cluster" "aks" {
  name                = "${PROJECT}-${SERVICE}-aks"
  location            = var.location
  resource_group_name = var.resource_group_name

  default_node_pool {
    name       = "default"
    node_count = 1
    vm_size    = "Standard_DS2_v2"
  }

  identity {
    type = "SystemAssigned"
  }

  tags = {
    project = var.project_name
    service = var.service_name
    tech    = var.tech_stack
  }
}
EOF
            # append AKS-specific outputs
            cat >> "$TARGET_DIR/outputs.tf" <<'EOF'
output "aks_cluster_name" {
  description = "AKS cluster name (if created)"
  value       = azurerm_kubernetes_cluster.aks.name
}
EOF

          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="add-rg-${RG}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add "$TARGET_DIR"
          git commit -m "Add resource group folder: ${RG} (generate AKS if requested)"
          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add resource group ${{ github.event.inputs.resource_group }}"
          title: "Add resource group ${{ github.event.inputs.resource_group }}"
          body: "Automated PR to add resource group folder `${{ github.event.inputs.resource_group }}`."
          base: ${{ github.event.inputs.base_branch }}
          head: ${{ steps.create.outputs.branch }}
