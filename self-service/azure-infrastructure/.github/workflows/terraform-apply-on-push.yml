name: Terraform Apply on Merge

on:
  push:
    branches:
      - develop

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_VERSION: '1.12.1'

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      changed_rgs: ${{ steps.changes.outputs.changed_rgs }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed resource groups
        id: changes
        run: |
          echo "Detecting changes under resource_groups/..."

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          CHANGED_RGS=$(echo "$CHANGED_FILES" \
            | grep '^resource_groups/' \
            | cut -d/ -f2 \
            | sort \
            | uniq \
            | tr '\n' ' ' \
            | tr -d ' ')

          if [ -z "$CHANGED_RGS" ]; then
            echo "No resource group changes detected"
            echo "changed_rgs=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed resource groups: $CHANGED_RGS"
          echo "changed_rgs=$CHANGED_RGS" >> $GITHUB_OUTPUT

  terraform-apply:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_rgs != ''
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rg: ${{ fromJson(format('["{0}"]', join(needs.detect-changes.outputs.changed_rgs, '","'))) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Set TF directory
        id: vars
        run: |
          TF_DIR="resource_groups/${{ matrix.rg }}"

          if [ ! -d "$TF_DIR" ]; then
            echo "Directory not found: $TF_DIR"
            exit 1
          fi

          echo "tf_dir=$TF_DIR" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: ${{ steps.vars.outputs.tf_dir }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ steps.vars.outputs.tf_dir }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ steps.vars.outputs.tf_dir }}
        run: terraform apply -auto-approve tfplan

      - name: Summary
        run: |
          echo "===================================="
          echo "Applied RG: ${{ matrix.rg }}"
          echo "Directory: ${{ steps.vars.outputs.tf_dir }}"
          echo "===================================="
